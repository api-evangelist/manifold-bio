name: Manifold Bio
description: 'Manifold Bio is a biotechnology company developing tissue-targeted biologic
  medicines. It runs a high-throughput in vivo discovery engine that pairs massively multiplexed
  in vivo screening — using mCode protein barcodes read out by DNA sequencing — with AI-powered
  protein and antibody design (mBER) and engineered mShuttle delivery vehicles. Its pipeline
  targets CNS diseases such as Alzheimer''s and Parkinson''s (amyloid-beta, tau, alpha-synuclein)
  and peripheral cardiometabolic disease. Backed by Playground Global. The company publishes no
  public developer API, SDK, documentation, or event surface as of this enrichment pass.'
